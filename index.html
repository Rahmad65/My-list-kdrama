<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My K-Drama List</title>
    <!-- Lucide Icons & Fonts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f101f;
            --bg-sidebar: #15162b;
            --bg-card: #1c1e36;
            --bg-card-hover: #242747;
            --accent-purple: #6c5ce7;
            --accent-pink: #fd79a8;
            --accent-blue: #00cec9;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
            --border-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: fixed;
            height: 100vh;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .brand-icon {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            padding: 10px;
            border-radius: 12px;
            display: flex;
        }

        .brand-title h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .brand-title p {
            font-size: 11px;
            color: var(--accent-pink);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--accent-purple);
            color: #fff;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
        }

        /* Header & Banner */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .search-bar {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 400px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
        }

        .btn-add {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-add:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .hero-banner {
            background: linear-gradient(rgba(15, 16, 31, 0.5), rgba(15, 16, 31, 0.8)), 
                        url('https://images.unsplash.com/photo-1517154421773-0529f29ea451?q=80&w=1200') center/cover;
            height: 180px;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 30px;
        }

        .hero-banner h1 {
            font-size: 32px;
            font-family: 'Georgia', serif;
            font-style: italic;
            color: #fce4ec;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-icon {
            padding: 12px;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .stat-info h3 {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-info p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Filter Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent-purple);
            color: #fff;
        }

        /* Drama Grid & Cards */
        .drama-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .drama-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .drama-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .poster-wrapper {
            position: relative;
            height: 250px;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-status {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }

        .badge-status.watched { color: #55efc4; }
        .badge-status.watching { color: #74b9ff; }
        .badge-status.plan { color: #a29bfe; }

        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 76, 76, 0.8);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
        }

        .drama-card:hover .btn-delete { opacity: 1; }

        .card-details {
            padding: 14px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-year {
            font-size: 12px;
            color: var(--text-muted);
            margin: 4px 0 8px 0;
        }

        .card-tags {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 10px;
            background-color: rgba(255,255,255,0.08);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
        }

        .card-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            color: #ffeaa7;
        }

        /* Modal Form */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
        }

        .modal h2 { margin-bottom: 20px; }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--bg-sidebar);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div>
            <div class="brand">
                <div class="brand-icon"><i data-lucide="clapperboard"></i></div>
                <div class="brand-title">
                    <h2>My K-Drama List</h2>
                    <p>Drama is my happy place ♡</p>
                </div>
            </div>
            <nav class="nav-menu">
                <a class="nav-item active"><i data-lucide="home"></i> Home</a>
                <a class="nav-item"><i data-lucide="list"></i> My List</a>
                <a class="nav-item"><i data-lucide="bar-chart-2"></i> Statistics</a>
                <a class="nav-item"><i data-lucide="heart"></i> Favorites</a>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="header">
            <div class="search-bar">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="Cari drama atau genre..." onkeyup="filterDrama()">
            </div>
            <button class="btn-add" onclick="toggleModal(true)">
                <i data-lucide="plus"></i> Tambah Drama
            </button>
        </header>

        <!-- Banner -->
        <section class="hero-banner">
            <h1>Welcome to<br>My K-Drama List ♡</h1>
            <p id="totalBannerSub" style="color: var(--text-muted); margin-top: 8px;">0 Dramas. Countless Memories.</p>
        </section>

        <!-- Stats -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--accent-purple)"><i data-lucide="film"></i></div>
                <div class="stat-info">
                    <h3 id="statTotal">0</h3>
                    <p>Total List</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: #55efc4"><i data-lucide="check-circle"></i></div>
                <div class="stat-info">
                    <h3 id="statWatched">0</h3>
                    <p>Watched</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: #74b9ff"><i data-lucide="play-circle"></i></div>
                <div class="stat-info">
                    <h3 id="statWatching">0</h3>
                    <p>Watching</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: #a29bfe"><i data-lucide="bookmark"></i></div>
                <div class="stat-info">
                    <h3 id="statPlan">0</h3>
                    <p>Plan to Watch</p>
                </div>
            </div>
        </section>

        <!-- Filter Controls -->
        <div class="controls">
            <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
            <button class="filter-btn" onclick="setFilter('Watched', this)">Watched</button>
            <button class="filter-btn" onclick="setFilter('Watching', this)">Watching</button>
            <button class="filter-btn" onclick="setFilter('Plan to Watch', this)">Plan to Watch</button>
        </div>

        <!-- Drama Cards Grid -->
        <div class="drama-grid" id="dramaGrid"></div>
    </main>

    <!-- Modal Form Tambah Drama -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Tambah Drama Baru</h2>
            <form id="dramaForm" onsubmit="addDrama(event)">
                <div class="form-group">
                    <label>Judul Drama</label>
                    <input type="text" id="title" required placeholder="Contoh: Taxi Driver">
                </div>
                <div class="form-group">
                    <label>Tahun Rilis</label>
                    <input type="text" id="year" required placeholder="Contoh: 2021-2023">
                </div>
                <div class="form-group">
                    <label>Rating (1.0 - 10.0)</label>
                    <input type="number" step="0.1" id="rating" required placeholder="Contoh: 9.1">
                </div>
                <div class="form-group">
                    <label>URL Gambar Poster</label>
                    <input type="url" id="poster" required placeholder="https://link-gambar.com/poster.jpg">
                </div>
                <div class="form-group">
                    <label>Genre (pisahkan dengan koma)</label>
                    <input type="text" id="genre" placeholder="Action, Crime">
                </div>
                <div class="form-group">
                    <label>Status Nonton</label>
                    <select id="status">
                        <option value="Watched">Watched</option>
                        <option value="Watching">Watching</option>
                        <option value="Plan to Watch">Plan to Watch</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="toggleModal(false)">Batal</button>
                    <button type="submit" class="btn-add">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Data awal sampel persis contoh gambar Anda
        const initialDramas = [
            { id: 1, title: 'Taxi Driver (S1-3)', year: '2021-2023', rating: 9.1, status: 'Watched', genre: ['Action', 'Crime'], poster: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=400' },
            { id: 2, title: 'Crash', year: '2024', rating: 8.5, status: 'Watching', genre: ['Crime', 'Comedy'], poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400' },
            { id: 3, title: 'Delivery Man', year: '2023', rating: 7.5, status: 'Plan to Watch', genre: ['Fantasy', 'Mystery'], poster: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=400' },
            { id: 4, title: 'The K2', year: '2016', rating: 8.1, status: 'Watched', genre: ['Action', 'Romance'], poster: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400' },
            { id: 5, title: 'Descendants of the Sun', year: '2016', rating: 8.7, status: 'Watched', genre: ['Romance', 'Drama'], poster: 'https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=400' }
        ];

        // Load data dari LocalStorage
        let dramas = JSON.parse(localStorage.getItem('myKdramas')) || initialDramas;
        let activeFilter = 'All';

        function renderGrid() {
            const grid = document.getElementById('dramaGrid');
            grid.innerHTML = '';

            const filtered = dramas.filter(d => {
                if (activeFilter === 'All') return true;
                return d.status === activeFilter;
            });

            filtered.forEach(drama => {
                const badgeClass = drama.status === 'Watched' ? 'watched' : (drama.status === 'Watching' ? 'watching' : 'plan');
                const cardHtml = `
                    <div class="drama-card">
                        <div class="poster-wrapper">
                            <img src="${drama.poster}" alt="${drama.title}" onerror="this.src='https://via.placeholder.com/200x300?text=No+Poster'">
                            <span class="badge-status ${badgeClass}">${drama.status}</span>
                            <button class="btn-delete" onclick="deleteDrama(${drama.id})"><i data-lucide="trash-2" style="width:14px"></i></button>
                        </div>
                        <div class="card-details">
                            <div class="card-title" title="${drama.title}">${drama.title}</div>
                            <div class="card-year">${drama.year}</div>
                            <div class="card-tags">
                                ${drama.genre.map(g => `<span class="tag">${g.trim()}</span>`).join('')}
                            </div>
                            <div class="card-rating">
                                <i data-lucide="star" style="width:14px; fill:#ffeaa7; color:#ffeaa7;"></i> ${drama.rating}
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });

            lucide.createIcons();
            updateStats();
        }

        function updateStats() {
            const total = dramas.length;
            const watched = dramas.filter(d => d.status === 'Watched').length;
            const watching = dramas.filter(d => d.status === 'Watching').length;
            const plan = dramas.filter(d => d.status === 'Plan to Watch').length;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statWatched').innerText = watched;
            document.getElementById('statWatching').innerText = watching;
            document.getElementById('statPlan').innerText = plan;
            document.getElementById('totalBannerSub').innerText = `${total} Dramas. Countless Memories.`;
        }

        function toggleModal(show) {
            document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none';
        }

        function addDrama(e) {
            e.preventDefault();
            const newDrama = {
                id: Date.now(),
                title: document.getElementById('title').value,
                year: document.getElementById('year').value,
                rating: parseFloat(document.getElementById('rating').value),
                poster: document.getElementById('poster').value,
                genre: document.getElementById('genre').value.split(','),
                status: document.getElementById('status').value
            };

            dramas.unshift(newDrama);
            localStorage.setItem('myKdramas', JSON.stringify(dramas));
            renderGrid();
            toggleModal(false);
            document.getElementById('dramaForm').reset();
        }

        function deleteDrama(id) {
            dramas = dramas.filter(d => d.id !== id);
            localStorage.setItem('myKdramas', JSON.stringify(dramas));
            renderGrid();
        }

        function setFilter(filter, btn) {
            activeFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrid();
        }

        function filterDrama() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.drama-card');
            
            cards.forEach(card => {
                const title = card.querySelector('.card-title').innerText.toLowerCase();
                const tags = card.querySelector('.card-tags').innerText.toLowerCase();
                if(title.includes(query) || tags.includes(query)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // Render pertama kali
        renderGrid();
    </script>
</body>
</html>
